name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: 24

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@5af416ede120848958d85c9720e61b921ac7bca6 # v1 (vite-plus 0.3.0)
        with:
          # Version auto-detects from the pnpm catalog pin (0.3.0). Keep the
          # runner's Node 24 rather than adopting vp env management.
          node-manager: false
          run-install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: vp check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: vp test run

      - name: Build
        run: vp build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e
