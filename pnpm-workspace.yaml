autoInstallPeers: false
engineStrict: true
onlyBuiltDependencies:
  - esbuild
  - workerd
peerDependencyRules:
  allowedVersions:
    typescript: 7.0.2
    vite: '*'
  allowAny:
    - vite
saveExact: true
strictPeerDependencies: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: 'catalog:'
  # Keep the prerelease signal runtime aligned with Solid RC.11; the caret range
  # otherwise advances independently and can break the runtime/compiler pair.
  '@solidjs/signals': 2.0.0-rc.11
